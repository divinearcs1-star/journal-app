spring:
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: journaldb
      auto-index-creation: true

  redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
#    host: ${REDIS_HOST}
#    port: 15844
#    password: ${REDIS_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ID}
    password: ${EMAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: weekly-sentiment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: com.firstproject.journalApp.model.*
            value:
              default:
                type: com.firstproject.journalApp.model.SentimentData
    properties:
      security:
        protocol: SASL_SSL
      sasl:
        mechanism: PLAIN
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_USERNAME}' password='${KAFKA_PASSWORD}';
      session:
        timeout:
          ms: 45000

server:
  port: ${PORT:${SERVER_PORT:8082}}
  servlet:
    context-path: /journalapp

weather:
  api:
    key: ${WEATHER_API}
jwt:
  secret: ${JWT_SECRET}
redirect:
  url: ${REDIRECT_URL}
frontend:
  url: ${FRONTEND_URL}
